name: CI/CD Pipeline Production

on:
  push:
    branches:
      - main # Sesuaikan dengan branch repositori kalian

jobs:
  Test-Pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Simple Test
        run: echo "From (deploy.yml) - Test pipeline executed successfully"

  build-app:
    runs-on: ubuntu-latest
    needs: Test-Pipeline

    steps:
      # Step 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Create build artifact
      - name: Build Application
        run: |
          mkdir dist
          echo "<h2>This is the result of an automated build artifact</h2>" > dist/index.html
          echo "Proses Build selesai, sampah dapur telah dibuang!"

      # Step 3: Upload artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hasil-build-web
          path: dist/
          retention-days: 7 # Otomatis dihapus setelah 7 hari agar kuota GitHub aman

  deploy-to-vps:
    runs-on: ubuntu-latest
    needs: build-app

    steps:
      # 1. Download artifact from previous job
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: hasil-build-web
          path: dist/

      # 2. Transfer files using SCP (via appleboy action)
      - name: Copy Artifact to VPS
        uses: appleboy/scp-action@v0.1.7 # concern > scp-action → file transfer only
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: 'dist/*'
          target: '~/backend-node' # Sesuaikan path di VPS kalian
          strip_components: 1 # removes "dist/" nesting (important)

      # 3. Execute remote command via SSH
      - name: Execute Remote Command
        uses: appleboy/ssh-action@v1.0.3 # concern > ssh-action → remote orchestration
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            echo "Memulai proses deployment di VPS..."
            ls -la ~/backend-node
            echo "Deployment Production Sukses!"
            echo "Memulai proses restart service di VPS..."
            pm2 restart all || echo "No process to restart"
