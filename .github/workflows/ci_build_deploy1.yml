name: CI/CD Pipeline Production

on:
  push:
    branches:
      - main # Sesuaikan dengan branch repositori kalian

jobs:
  Test-Pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Simple Test
        run: echo "From (deploy.yml) - Test pipeline executed successfully"

  build-app:
    runs-on: ubuntu-latest
    needs: Test-Pipeline

    steps:
      # Step 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Create build artifact
      - name: Build Application
        run: |
          mkdir dist
          echo "<h2>This is the result of an automated build artifact</h2>" > dist/index.html
          echo "Proses Build selesai, sampah dapur telah dibuang!"

      # Step 3: Upload artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4 # upload-artifact
        with:
          name: hasil-build-web
          path: dist/
          retention-days: 7 # Otomatis dihapus setelah 7 hari agar kuota GitHub aman

  deploy-to-vps:
    runs-on: ubuntu-latest
    needs: build-app

    steps:
      # 1. Download artifact from previous job
      - name: Download Build Artifact
        uses: actions/download-artifact@v4 # download-artifact
        with:
          name: hasil-build-web
          path: dist/

      - name: Setup SSH Key
        # new dir (~/.ssh) → Set correct permissions
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add VPS to Known Hosts
        run: |
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy Files to VPS (SCP)
        # scp [opsi] /path/sumber user@IP_Server:/path/tujuan
        run: |
          scp -r dist/* ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/app/
          chown -R 755 /var/www/app/
          chown -R www-data:www-data /var/www/app/

      - name: Execute Remote Command (SSH)
        run: |
          ssh {{ secrets.VPS_USER }}@{{ secrets.VPS_HOST }} "echo Deployment Done!"
